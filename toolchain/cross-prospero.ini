# The meson cross file for Prospero-generation hardware.
#
# Paths here are container paths: the build always runs inside the image from
# toolchain/Dockerfile with the repository bind-mounted at /w, so they are stable and carry
# nothing about the machine underneath.
#
# The compiler and the target triple are the ones oops-apps builds titles with
# (`common/app.mk`), so the shims, Mesa and the title that links them all see one compiler and
# one ABI. Bare `clang` here is the image's, and the image's tag is the pin (D013): this
# file is only ever read inside the container, so there is no second compiler it could reach.
# That was not true of `app.mk`, whose identical spelling resolved to a different compiler
# depending on the runner, which is the defect D013 was written for. What is deliberately *not* carried over from app.mk is `-ffreestanding -nostdlib`:
# a title linking oops-mesa is hosted, which is the divergence D002 states and CLAUDE.md
# principle 5 confines.
#
# The sysroot is staged by toolchain/stage-sysroot.sh from the checkout D004 pins.

[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
python = 'python3'
pkg-config = 'pkg-config'

[host_machine]
system = 'freebsd'
kernel = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# Nothing built here can be run here: the host is FreeBSD on a console. meson must answer its
# configure questions by compiling and linking rather than by running, and fail loudly where it
# cannot, rather than quietly assuming a default that happens to match the build machine.
needs_exe_wrapper = true

[built-in options]
# `-DNO_REGEX` selects the stub `regcomp`/`regexec`/`regfree` that `util/xmlconfig.c` carries for
# platforms without a regex library, instead of `#include <regex.h>`.
#
# It is not a capability choice. The code that calls them is `parseAppAttr`, an expat element
# handler, and expat is not linked here - `-Dxmlconfig=disabled` already sees to that, and
# `xmlconfig.c.o` has no `XML_*` reference to prove it. So the calls were unreachable and the
# three imports were dead weight. They were also three of the eleven names obSCEne's corpus
# cannot place, so a title could not be built while they were in the import list
# (REQ-20260916T2200Z-4d7e). Removing them costs nothing that was reachable.
#
# The guard is spelled `NO_REGEX` rather than `WITH_XMLCONFIG`; the two are separate in that file,
# which is why disabling xmlconfig did not already do this.
# `-ftls-model=initial-exec`, because the General Dynamic model cannot work on this platform.
#
# Mesa compiles `-fPIC`, so every `__thread` access defaults to General Dynamic: a call to
# `__tls_get_addr` with a descriptor, resolved at run time. That call is what `MESA00001` died on
# twice, in two different ways, and the second death is the one that decides this.
#
# First it died because the *variable* was missing: `tolower` reaches `_ThreadRuneLocale`, which
# `libSceLibcInternal` does not export (obSCEne REQ-20260917T1640Z-5b28, 3,016 of that library's
# symbols captured and no such name among them). Defining it in the title fixed that, and the
# failure moved.
#
# Then it died *inside* `__tls_get_addr` itself. `libkernel` does export it - measured at
# `+0x3b960` - and the fault is at `+0x3bac9`, a null dereference `0x169` bytes into the function.
# So the resolver exists, is reached, and cannot answer: the per-thread bookkeeping a General
# Dynamic lookup walks is not set up for a title's own thread-local block.
#
# Initial Exec is the model that fits. The thread-pointer offset lives in a GOT entry the loader
# fills once, and the access is a `%fs`-relative load through it - no call, and nothing walked per
# access. That suits a thread-local in an image present from the start, which after the change
# above is every one Mesa touches: its own (`_mesa_glapi_tls_Context`, ACO's instruction buffer)
# and now `_ThreadRuneLocale` as well.
#
# **Local Exec was tried first and the linker refuses it**, which is worth recording so nobody
# tries again:
#
#     ld.lld: error: relocation R_X86_64_TPOFF32 against _ThreadRuneLocale
#             cannot be used with -shared
#
# A title is linked `-shared` (`app.mk`), and Local Exec bakes an absolute thread-pointer offset
# that is only meaningful in a non-shared image. Initial Exec is the strongest model a shared
# object may use, so it is the end of that road rather than a preference between the two.
#
# If a future pin introduces a thread-local that genuinely lives in another module, Initial Exec
# is wrong for it and the loader will fail to fill its GOT entry, which is a loud failure rather
# than a quietly wrong slot.
c_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-fPIC', '-ftls-model=initial-exec', '-fno-stack-protector', '-DOOPS_MESA_WINSYS', '-DNO_REGEX', '-I/w/src/winsys']
# `-fno-exceptions -fno-rtti` for all of Mesa's C++, not just ACO's.
#
# ACO already sets both for itself; Mesa's other C++ does not, and the difference is expensive
# here. Compiling with exceptions pulls in the unwinder and the C++ ABI's type machinery -
# `_Unwind_Resume`, `__cxxabiv1` vtables, `std::terminate` - and none of that exists on this
# platform: its own C++ library is a different implementation with a different ABI (D006), so
# those symbols cannot be resolved at load the way libc names can.
#
# Mesa is written not to throw, which is why ACO can already turn them off. If some file turns
# out to need them, it will fail to compile and say which, which is the failure this wants.
# `-ftls-model=initial-exec` for the same reason as `c_args`; ACO's per-thread instruction buffer is
# a C++ thread-local and would otherwise emit the same General Dynamic call.
cpp_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-stdlib=libc++', '-fno-exceptions', '-fno-rtti', '-fPIC', '-ftls-model=initial-exec', '-fno-stack-protector', '-DOOPS_MESA_WINSYS', '-I/w/src/winsys']
# The sysroot carries headers, libelf and a one-symbol archive that provides an entry point, so
# that meson's link probes answer a real question. `-nostdlib` keeps the build machine's
# libraries out; `-lplatform` is an archive holding one empty definition per symbol obSCEne measured present on
# this console, so a probe answers "did a sweep find this?" rather than "did a link flag allow
# it?" See toolchain/stage-platform-stubs.sh.
#
# What that means for an answer, stated: compiler builtins are reported correctly, because the
# compiler either has them or does not. Library functions are reported present exactly when a
# measurement on this console found them. Anything nobody measured reports absent, and Mesa
# takes its own portable path, which is the safe direction.
#
# The alternative, allowing undefined symbols, was tried first and is worse. Every probe then
# succeeds, and Mesa concluded clang had GCC's `__builtin_add_overflow_p` and ARM's FPSCR
# builtins while targeting x86-64. That surfaced a thousand objects later as a compile error in
# generated code.
#
# Which symbols the platform actually provides is a separate question with its own evidence:
# obSCEne's import census and `docs/hardware`. Nothing here answers it, and nothing is linked
# into a final binary at build time in any case - the output is static archives that a title
# links later, against oops-sdk and the platform's own exports.
c_link_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-fuse-ld=lld', '-nostdlib', '-lplatform']
cpp_link_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-stdlib=libc++', '-fuse-ld=lld', '-nostdlib', '-lplatform']
# Static everywhere: the title links archives, and there is no dynamic loader here that would
# resolve a Mesa shared object.
default_library = 'static'
