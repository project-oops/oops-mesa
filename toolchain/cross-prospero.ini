# The meson cross file for Prospero-generation hardware.
#
# Paths are container paths: the build runs inside the image from toolchain/Dockerfile with the
# repository bind-mounted at /w. The compiler and target triple match oops-apps (`common/app.mk`),
# and bare `clang` is the image's, pinned by its tag (D013). `-ffreestanding -nostdlib` is not
# carried over from app.mk: a title linking oops-mesa is hosted (D002). The sysroot is staged by
# toolchain/stage-sysroot.sh.

[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
python = 'python3'
pkg-config = 'pkg-config'

[host_machine]
system = 'freebsd'
kernel = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# Nothing built here runs here, so meson answers configure questions by compiling and linking
# and fails where it cannot, rather than assuming the build machine's answer.
needs_exe_wrapper = true

[built-in options]
# `-DNO_REGEX` selects the stub `regcomp`/`regexec`/`regfree` in `util/xmlconfig.c`. Their only
# caller is an expat handler, and expat is not linked (`-Dxmlconfig=disabled` does not cover
# this guard), so the calls are unreachable and the imports would be unplaceable.
#
# `-ftls-model=initial-exec`: Mesa compiles `-fPIC`, which defaults `__thread` to General
# Dynamic, a call to `__tls_get_addr`. The platform's `__tls_get_addr` faults on a title's own
# thread-local block. Initial Exec is a `%fs`-relative load through a GOT entry the loader fills
# once, and is the strongest model a `-shared` image (`app.mk`) may use; Local Exec's
# R_X86_64_TPOFF32 is refused by the linker. A thread-local living in another module would fail
# loudly at load under this model.
c_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-fPIC', '-ftls-model=initial-exec', '-fno-stack-protector', '-DOOPS_MESA_WINSYS', '-DNO_REGEX', '-I/w/src/winsys']
# `-fno-exceptions -fno-rtti` for all of Mesa's C++, not just ACO's: exceptions pull in the
# unwinder and C++ ABI type machinery, which the platform's differently-built C++ library cannot
# resolve (D006). Mesa is written not to throw; a file that needs exceptions fails to compile.
# `-ftls-model=initial-exec` as in `c_args`, for ACO's per-thread instruction buffer.
cpp_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-stdlib=libc++', '-fno-exceptions', '-fno-rtti', '-fPIC', '-ftls-model=initial-exec', '-fno-stack-protector', '-DOOPS_MESA_WINSYS', '-I/w/src/winsys']
# `-nostdlib` keeps the build machine's libraries out. `-lplatform` holds an entry point and one
# empty definition per symbol obSCEne measured present on this console
# (toolchain/stage-platform-stubs.sh), so a link probe reports compiler builtins and measured
# functions present and anything unmeasured absent, sending Mesa to its portable path. Allowing
# undefined symbols instead makes every probe succeed, including for builtins x86-64 lacks.
# Nothing here is linked into a final binary: the output is static archives a title links later.
c_link_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-fuse-ld=lld', '-nostdlib', '-lplatform']
cpp_link_args = ['-target', 'x86_64-unknown-freebsd', '--sysroot=/w/toolchain/sysroot', '-stdlib=libc++', '-fuse-ld=lld', '-nostdlib', '-lplatform']
# Static everywhere: a title links archives, and no loader here resolves a Mesa shared object.
default_library = 'static'
